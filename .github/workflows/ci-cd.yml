name: CI/CD Notebook Project

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -f notebook/pom.xml clean package -DskipTests

  build-docker-images:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Image
        run: docker build -t notebook-backend -f docker/backend/Dockerfile .
      - name: Build Frontend Image
        run: docker build -t notebook-frontend -f docker/frontend/Dockerfile .