name: CI/CD Pipeline

on:
  push:
    branches: [ master ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test
        run: mvn clean package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Deploy to Railway
        run: npx @railway/cli up --service pnaiva --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  healthcheck:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health Check
        run: |
          HOST=$(echo "${{ secrets.RAILWAY_APP_URL }}" | tr -d '[:space:]"' | sed 's|^https?://||' | sed 's|/$||')
          
          if [ -z "$HOST" ]; then
            echo "Error: Host is empty"
            exit 1
          fi

          TARGET="https://${HOST}/actuator/health"
          echo "Probing $TARGET"
          
          # 10 попыток по 15 секунд (2.5 минуты на прогрев Spring Boot)
          for i in {1..10}; do
            STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" "$TARGET" || echo "000")
          
            if [ "$STATUS" -eq 200 ]; then
              echo "App is UP!"
              exit 0
            fi
          
            echo "Attempt $i: Status $STATUS. Waiting 15s..."
            sleep 15
          done
          
          echo "Health check timed out"
          exit 1