name: CI/CD Pipeline

on:
  push:
    branches: [ master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  HEALTH_URL: "https://${{ secrets.RAILWAY_APP_URL }}/actuator/health"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test
        run: mvn -B clean verify

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        run: railway up --service pnaiva --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  healthcheck:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health Check
        run: curl --silent --show-error --fail --retry 15 --retry-delay 10 --retry-all-errors "$HEALTH_URL"