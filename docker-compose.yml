services:
  db:
    image: postgres:16-alpine
    container_name: notebook-db
    environment:
      - POSTGRES_DB=notebook_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
    ports:
      - "5432:5432"

  backend:
    build:
      context: .                          # Корень проекта (тут лежит pom.xml и src)
      dockerfile: docker/backend/Dockerfile # Путь к файлу сборки
    container_name: notebook-backend
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/notebook_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=pass
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend                 # Папка с фронтендом
      dockerfile: ../docker/frontend/Dockerfile
    container_name: notebook-frontend
    ports:
      - "3000:3000"